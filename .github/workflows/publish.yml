name: Publish Package

on:
  push:
    tags:
      - 'v*'  # Triggers on tags like v1.0.0, v2.1.3, etc.

jobs:
  test-before-publish:
    name: Run tests before publishing
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install

      - name: Run tests
        run: poetry run tox

  # Publishes only after every matrix job above is green: a failed `needs` job
  # skips this one.
  publish-release:
    name: Publish release
    needs: test-before-publish
    runs-on: ubuntu-latest

    # The PyPI trusted publisher is configured against this environment, so the
    # name has to stay in sync with the publisher registered on PyPI.
    environment: pypi

    permissions:
      # Lets the job mint the short-lived OIDC token that PyPI exchanges for an
      # upload token. Trusted publishing stores no API token anywhere.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # Stable version used just to build the dists

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      # `poetry build` reads pyproject.toml directly, so the project's own
      # dependencies never need installing here.
      - name: Build package
        run: poetry build

      - name: Verify package contents
        run: |
          ls -la dist/
          pipx run twine check dist/*

      # Poetry has no OIDC support of its own (python-poetry/poetry#7940), so the
      # token exchange for the trusted publisher runs through this action. It
      # uploads everything in dist/.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
