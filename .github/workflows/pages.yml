name: Pages

# Builds the landing page and docs under `docs/` (an Astro site; the docs pages are
# MDX files in docs/src/content/docs/) and publishes the result to GitHub Pages at
# https://vintasoftware.github.io/vintasend/.
#
# Deploys on every push to `main` that touches `docs/`, and on demand from any
# branch through `workflow_dispatch`. One-time setup on GitHub: Settings → Pages →
# Source: GitHub Actions. This workflow cannot flip that switch.

on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
